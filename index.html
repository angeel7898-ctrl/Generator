<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Генератор - Teletype parodia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* 1В1 ТВОЙ ОРИГИНАЛЬНЫЙ ДИЗАЙН */
  :root{
    --bg: #0B0B0D;
    --panel: #141416;
    --line: #232327;
    --ink: #F2F2F3;
    --ink-soft: #8A8A90;
    --accent: #F2F2F3;
    --topbar-bg: #0B0B0D;
    --topbar-ink: #F2F2F3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background:var(--bg);
  }
  .wrap{max-width:520px;margin:0 auto;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;
    position:sticky;top:0;
    background:var(--topbar-bg);
    color:var(--topbar-ink);
    z-index:5;
  }
  .brand{font-weight:800;font-size:16px;letter-spacing:-.01em;color:var(--topbar-ink);}

  .content{padding:24px 18px 100px;}

  input[type=text]{
    width:100%;
    border:none;
    background:transparent;
    padding:6px 0 14px;
    font-size:28px;
    font-family:Georgia, 'Times New Roman', serif;
    font-weight:400;
    color:var(--ink);
    outline:none;
    border-bottom:1px solid var(--line);
  }
  input[type=text]::placeholder{color:#4C4C52;font-weight:400;}

  .add-row{display:flex;align-items:center;gap:9px;margin:20px 0 24px;}
  .add-btn{
    width:30px;height:30px;border-radius:50%;
    border:1.5px solid var(--line);
    background:transparent;color:var(--ink);font-size:15px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
    transition:.15s border-color, .15s background;
  }
  .add-btn:hover{border-color:#B8B8B8; background:var(--panel);}
  .add-label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}

  .visually-hidden{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

  .shots{display:flex;flex-direction:column;gap:9px;}
  .shot{position:relative;}
  .shot img{width:100%;display:block;border-radius:4px; min-height:160px; background:#18181c;}
  .shot .rm{
    position:absolute;top:8px;right:8px;
    width:26px;height:26px;border-radius:50%;
    border:none;background:rgba(0,0,0,.6);color:#fff;
    font-size:14px;line-height:1;cursor:pointer;
  }

  .publish-bar{
    position:fixed;left:0;right:0;bottom:0;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .publish-inner{max-width:520px;margin:0 auto;}
  .btn{
    width:auto;min-width:140px;border:2px solid var(--accent);border-radius:999px;
    padding:13px 28px;
    font-family:'Inter',sans-serif;font-size:14px;font-weight:700;letter-spacing:.02em;
    color:var(--accent);cursor:pointer;background:transparent;
    text-transform:uppercase;
    transition:.15s opacity, .15s transform, .15s background, .15s color;
  }
  .btn:hover{background:var(--accent);color:#0B0B0D;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:#1A1A1A;color:#fff;font-weight:600;font-size:13px;
    padding:10px 16px;border-radius:10px;
    opacity:0;pointer-events:none;transition:.25s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
</style>
</head>
<body>

<div class="wrap" id="root">
  <div class="topbar"><div class="brand">Teletype parodia (Генератор)</div></div>
  <div class="content">
    <input type="text" id="titleInput" placeholder="Название игры" maxlength="80">

    <div class="add-row">
      <label class="add-btn" for="fileInput">+</label>
      <div class="add-label" id="addLabel">Добавить скрины из галереи (0/120)</div>
    </div>
    <input type="file" id="fileInput" class="visually-hidden" accept="image/*" multiple>

    <div class="shots" id="shots"></div>
  </div>

  <div class="publish-bar">
    <div class="publish-inner">
      <button class="btn" id="generateBtn">СКАЧАТЬ ГОТОВЫЙ САЙТ</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const MAX_IMAGES = 120;
  let imagesBase64 = [];
  const toastEl = document.getElementById('toast');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 1800);
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function fileToCompressedDataUrl(file, maxW=900, quality=0.7){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > maxW){
            h = Math.round(h * (maxW / w));
            w = maxW;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  const fileInput = document.getElementById('fileInput');
  const addLabel = document.getElementById('addLabel');
  const shotsDiv = document.getElementById('shots');
  const generateBtn = document.getElementById('generateBtn');

  function renderShots(){
    shotsDiv.innerHTML = imagesBase64.map((src, i)=>`
      <div class="shot">
        <img src="${src}" loading="lazy">
        <button data-i="${i}" class="rm">✕</button>
      </div>
    `).join('');
    
    shotsDiv.querySelectorAll('.rm').forEach(btn=>{
      btn.onclick = ()=>{
        imagesBase64.splice(Number(btn.dataset.i), 1);
        addLabel.textContent = `Добавить скрины из галереи (${imagesBase64.length}/${MAX_IMAGES})`;
        renderShots();
      };
    });
  }

  fileInput.onchange = async (e)=>{
    const remaining = MAX_IMAGES - imagesBase64.length;
    if(remaining <= 0){
      showToast(`Максимум ${MAX_IMAGES} скринов`);
      fileInput.value = '';
      return;
    }
    const files = Array.from(e.target.files || []).slice(0, remaining);
    
    generateBtn.disabled = true;
    generateBtn.textContent = 'Обработка...';
    
    for(const f of files){
      try {
        const url = await fileToCompressedDataUrl(f);
        imagesBase64.push(url);
      } catch(err) { console.error(err); }
    }
    
    addLabel.textContent = `Добавить скрины из галереи (${imagesBase64.length}/${MAX_IMAGES})`;
    renderShots();
    fileInput.value = '';
    
    generateBtn.disabled = false;
    generateBtn.textContent = 'СКАЧАТЬ ГОТОВЫЙ САЙТ';
  };

  generateBtn.onclick = () => {
    const titleInput = document.getElementById('titleInput');
    const title = titleInput.value.trim() || 'Без названия';
    
    if(!imagesBase64.length){
      showToast('Добавь хотя бы один скрин');
      return;
    }

    generateBtn.disabled = true;
    generateBtn.textContent = 'Создаем...';
    
    const dateStr = new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});

    // Убрал \\n в join(), теперь текст будет чистым
    const template = `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>${escapeHtml(title)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg: #0B0B0D; --panel: #141416; --line: #232327; --ink: #F2F2F3; --ink-soft: #8A8A90; --topbar-bg: #0B0B0D; --topbar-ink: #F2F2F3; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ min-height:100vh; font-family:'Inter', sans-serif; color:var(--ink); background:var(--bg); }
  .wrap{max-width:520px;margin:0 auto; padding-bottom: 50px;}
  .topbar{ display:flex;align-items:center;justify-content:space-between; padding:16px 18px; position:sticky;top:0; background:var(--topbar-bg); color:var(--topbar-ink); z-index:5; }
  .brand{font-weight:800;font-size:16px;letter-spacing:-.01em;color:var(--topbar-ink);}
  .post-meta-top{font-size:12.5px;color:var(--ink-soft);font-weight:600;padding:24px 18px 0;}
  .post-title{font-size:32px;font-weight:800;font-family:'Inter',sans-serif;letter-spacing:-.01em;padding:20px 18px 20px;}
  .gallery{display:flex;flex-direction:column;gap:28px;padding:0 18px;}
  .gallery img{width:100%;display:block;border-radius:4px; min-height:220px; background:#18181c; content-visibility:auto;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="brand">Teletype parodia</div></div>
  <div class="post-meta-top">${dateStr}</div>
  <div class="post-title">${escapeHtml(title)}</div>
  <div class="gallery">
    ${imagesBase64.map(src => `<img src="${src}" loading="lazy">`).join('')}
  </div>
</div>
</body>
</html>`;

    const blob = new Blob([template], { type: "text/html;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "index.html";
    
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    showToast('Файл скачан! Загрузи его на хостинг.');
    
    generateBtn.disabled = false;
    generateBtn.textContent = 'СКАЧАТЬ ГОТОВЫЙ САЙТ';
  };
</script>
</body>
</html>
